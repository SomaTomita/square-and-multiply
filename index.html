<!doctype html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Square &amp; Multiply</title>
  <meta name="description" content="Learn how cryptography works step by step: modular arithmetic, RSA, ElGamal, Diffie–Hellman, and TLS. Drag any number in a formula and watch every step move.">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <script src="assets/js/boot.js"></script>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/modes.css">
  <link rel="stylesheet" href="assets/css/basics.css">
  <link rel="stylesheet" href="assets/css/rsa.css">
  <link rel="stylesheet" href="assets/css/dh.css">
  <link rel="stylesheet" href="assets/css/tls.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script type="module" src="assets/js/stage.js"></script>
</head>
<body>
  <header class="strip">
    <a class="wordmark" href="#basics">Square &amp; Multiply</a>
    <nav id="modes" class="notches" aria-label="Modes"></nav>
    <div class="sizes" role="group" aria-label="Text size">
      <button type="button" data-set-size="s" aria-label="Small text">A</button>
      <button type="button" data-set-size="m" aria-label="Medium text">A</button>
      <button type="button" data-set-size="l" aria-label="Large text">A</button>
    </div>
    <label class="lang">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></svg>
      <span id="lang-code" class="lang-code" aria-hidden="true"></span>
      <select id="lang" aria-label="Language"></select>
    </label>
  </header>

  <nav id="scenes" class="scenes" aria-label="Topics"></nav>

  <main id="board" class="board"></main>

  <footer class="deck">
    <div class="tape-window">
      <ol id="tape" class="tape" aria-label="Steps"></ol>
    </div>
    <div class="controls">
      <button type="button" id="prev" class="back" aria-label="Previous step" title="Previous step (←)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <button type="button" id="play" class="play" aria-label="Play all steps" title="Play (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-play" d="M8 5v14l11-7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button type="button" id="next" class="lever" aria-label="Next step" title="Next step (→ or space)">
        <svg viewBox="0 0 48 64" aria-hidden="true">
          <rect class="lever-slot" x="20" y="22" width="8" height="38" rx="4"/>
          <g class="lever-arm">
            <rect x="21.5" y="10" width="5" height="34" rx="2.5"/>
            <circle cx="24" cy="10" r="9"/>
          </g>
        </svg>
      </button>
      <span id="count" class="count" aria-live="polite"></span>
    </div>
  </footer>
</body>
</html>
